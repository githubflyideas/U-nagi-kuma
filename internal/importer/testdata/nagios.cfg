# Sample Nagios object configuration
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}
define command {
    command_name    check_http
    command_line    $USER1$/check_http -I $HOSTADDRESS$ $ARG1$
}
define command {
    command_name    check_https_vhost
    command_line    $USER1$/check_http -H $ARG1$ -S -u $ARG2$ -s "$ARG3$" -C 21,7
}
define command {
    command_name    check_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}
define command {
    command_name    check_ssh
    command_line    $USER1$/check_ssh $HOSTADDRESS$
}
define command {
    command_name    check_dns
    command_line    $USER1$/check_dns -H $ARG1$ -s $HOSTADDRESS$ -a $ARG2$
}
define command {
    command_name    check_mysql_cmd
    command_line    $USER1$/check_mysql -H $HOSTADDRESS$ -u $ARG1$ -p $ARG2$
}
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}
define command {
    command_name    restart-httpd
    command_line    $USER1$/eventhandlers/restart-httpd $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$
}
define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "..." | /bin/mail -s "x" $CONTACTEMAIL$
}

define timeperiod {
    timeperiod_name 24x7
    alias           24 Hours A Day, 7 Days A Week
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
}
define timeperiod {
    timeperiod_name workhours
    alias           Normal Work Hours
    monday          09:00-17:00
    tuesday         09:00-17:00
    wednesday       09:00-17:00
    thursday        09:00-17:00
    friday          09:00-12:00,13:00-17:00
    december 25     00:00-24:00
}

define contact {
    name                            generic-contact
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_commands   notify-service-by-email
    register                        0
}
define contact {
    contact_name    nagiosadmin
    use             generic-contact
    alias           Nagios Admin
    email           admin@example.com
}
define contact {
    contact_name    alice
    use             generic-contact
    email           alice@example.com
    pager           +8613800000000
    service_notification_period workhours
}
define contact {
    contact_name    bob
    use             generic-contact
}
define contactgroup {
    contactgroup_name   admins
    members             nagiosadmin,alice,bob
}

define host {
    name                    linux-server
    check_command           check-host-alive
    max_check_attempts      10
    check_interval          5
    retry_interval          1
    contact_groups          admins
    notification_interval   120
    notification_options    d,u,r
    register                0
}
define host {
    use         linux-server
    host_name   gw
    alias       Core Gateway
    address     10.0.0.1
}
define host {
    use         linux-server
    host_name   web1
    address     10.0.0.10
    parents     gw
    hostgroups  web-servers
}
define host {
    use         linux-server
    host_name   web2
    address     10.0.0.11
    parents     gw
}
define host {
    use         linux-server
    host_name   db1
    address     10.0.0.20
    parents     gw
    contact_groups +dbas
}
define hostgroup {
    hostgroup_name  web-servers
    alias           Web Servers
    members         web2
}

define service {
    name                    generic-service
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    notification_interval   0
    register                0
}
define service {
    use                 generic-service
    hostgroup_name      web-servers
    service_description HTTP
    check_command       check_http!-u /health -e 200
    event_handler       restart-httpd
}
define service {
    use                 generic-service
    host_name           web1
    service_description Site
    check_command       check_https_vhost!www.example.com!/login!Sign in
    contacts            alice
}
define service {
    use                 generic-service
    host_name           *
    host_name           web1,web2,db1,!web2
    service_description SSH
    check_command       check_ssh
}
define service {
    use                 generic-service
    host_name           gw
    service_description DNS
    check_command       check_dns!example.com!93.184.216.34
}
define service {
    use                 generic-service
    host_name           db1
    service_description MySQL
    check_command       check_mysql_cmd!monitor!s3cret
}
define service {
    use                 generic-service
    host_name           db1
    service_description Load
    check_command       check_nrpe!check_load
    active_checks_enabled 0
}
define service {
    use                 generic-service
    host_name           db1
    service_description Redis
    check_command       check_tcp!6379
}
define servicegroup {
    servicegroup_name   web
    members             web1,HTTP
}
define servicedependency {
    host_name                       db1
    service_description             MySQL
    dependent_host_name             web1
    dependent_service_description   HTTP
}
