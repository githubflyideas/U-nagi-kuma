}
define command {
    command_name    check_dns_custom
    command_line    $USER1$/check_dns -H $ARG1$ -s $ARG2$
}
define command {
    command_name    check_custom_macro
    command_line    $USER1$/check_x -H $HOSTADDRESS$ -t $SERVICEDESC$ -k $_HOSTSITE$
