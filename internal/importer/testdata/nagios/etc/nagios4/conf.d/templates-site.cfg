# Site templates (multiple inheritance, chains)
define host {
    name                    site-base
    use                     generic-host
    check_period            24x7
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    contact_groups          admins
    notification_interval   60
    notification_period     workhours
    register                0
}
define host {
    name                    linux-prod
    use                     site-base,linux-server
    hostgroups              +linux-servers
    notes                   Production Linux
    register                0
}
define host {
    name                    network-device
    use                     site-base
    check_command           check-host-alive
    contact_groups          netops
    register                0
}
define service {
    name                    site-service
    use                     generic-service
    check_interval          5
    retry_interval          1
    max_check_attempts      4
    contact_groups          admins
    notification_options    w,c,r
    register                0
}
define service {
    name                    critical-service
    use                     site-service
    check_interval          1
    contact_groups          +oncall
    first_notification_delay 5
    register                0
}
