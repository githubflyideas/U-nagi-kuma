define contact {
    contact_name            alice
    use                     generic-contact
    alias                   Alice Ops
    email                   alice@example.com
    pager                   +15550001111
    service_notification_period   24x7
    host_notification_period      24x7
}
define contact {
    contact_name            bob
    use                     generic-contact
    alias                   Bob Net
    email                   bob@example.com
    contactgroups           netops
    service_notification_period   workhours
}
define contact {
    contact_name            carol
    use                     generic-contact
    alias                   Carol (no email)
}
define contact {
    contact_name            dave
    use                     generic-contact
    email                   dave@example.com
    service_notification_period   nights
}
define contactgroup {
    contactgroup_name       oncall
    alias                   On-call team
    members                 alice,dave
}
define contactgroup {
    contactgroup_name       netops
    alias                   Network team
    members                 carol
}
define contactgroup {
    contactgroup_name       everyone
    alias                   Everyone
    contactgroup_members    oncall,netops,admins
}
define timeperiod {
    timeperiod_name         nights
    alias                   Nights and weekends
    monday                  00:00-08:00,18:00-24:00
    tuesday                 00:00-08:00,18:00-24:00
    wednesday               00:00-08:00,18:00-24:00
    thursday                00:00-08:00,18:00-24:00
    friday                  00:00-08:00,18:00-24:00
    saturday                00:00-24:00
    sunday                  00:00-24:00
}
define timeperiod {
    timeperiod_name         holidays-excluded
    alias                   Work hours without holidays
    use                     workhours
    exclude                 us-holidays
    december 25             00:00-00:00
}
