define servicegroup {
    servicegroup_name       web-checks
    alias                   Web checks
    members                 web1,HTTP,web2,HTTP
}
define serviceescalation {
    host_name               web1
    service_description     HTTP
    first_notification      3
    last_notification       0
    notification_interval   30
    contact_groups          everyone
}
define hostdependency {
    host_name               core-sw1
    dependent_host_name     web1
    notification_failure_criteria d,u
}
define hostextinfo {
    host_name               web1
    icon_image              web.png
}

# A credential from resource.cfg ($USER3$) becomes a secret.
define service {
    use                     site-service
    host_name               web2
    service_description     API token
    check_command           check_api_token
}
