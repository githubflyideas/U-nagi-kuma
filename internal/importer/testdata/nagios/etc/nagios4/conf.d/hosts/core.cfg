; core network
define hostgroup {
    hostgroup_name          network
    alias                   Network devices
    members                 core-sw1,core-rtr1
}
define hostgroup {
    hostgroup_name          web-servers
    alias                   Web servers
}
define hostgroup {
    hostgroup_name          db-servers
    alias                   Databases
    members                 db1,db2
}
define hostgroup {
    hostgroup_name          all-prod
    alias                   All production
    hostgroup_members       web-servers,db-servers
}
define host {
    use                     network-device
    host_name               core-rtr1
    alias                   Core router
    address                 10.0.0.1
}
define host {
    use                     network-device
    host_name               core-sw1
    alias                   Core switch 1
    address                 10.0.0.2
    parents                 core-rtr1
}
define host {
    use                     linux-prod
    host_name               web1
    alias                   Web server 1
    address                 10.0.1.11
    parents                 core-sw1
    hostgroups              web-servers
    _SITE                   tokyo
}
define host {
    use                     linux-prod
    host_name               web2
    alias                   Web server 2
    address                 10.0.1.12
    parents                 core-sw1
    hostgroups              web-servers
}
define host {
    use                     linux-prod
    host_name               db1
    address                 10.0.2.21
    parents                 core-sw1
}
define host {
    use                     linux-prod
    host_name               db2
    address                 10.0.2.22
    parents                 core-sw1
    active_checks_enabled   0
}
define host {
    use                     linux-prod
    host_name               mail1
    alias                   Mail server
    address                 mail1.example.com
    check_command           check_tcp!25
}
define host {
    use                     generic-host
    host_name               dmz-noaddr
}
define host{
	use			windows-server
	host_name		winsrv1
	alias			Windows File Server
	address			10.0.3.5
	}
